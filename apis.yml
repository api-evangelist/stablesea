aid: stablesea
name: Stablesea
description: >-
  Stable Sea is a financial technology platform providing global cash management
  and liquidity for companies building in stablecoins. The Stable Sea Terminal lets
  businesses consolidate on-chain and off-chain accounts, settle money across 40+
  countries, run fiat-to-stablecoin on/off-ramps for transactions up to $50M, earn
  yield through tokenized money-market funds, and hold Bitcoin in insured custody.
  The Stable Sea Terminal API is a bearer-authenticated REST API (OpenAPI 3.1) for
  managing organizations, liquidity providers and exchange rates, external payment
  instruments, offerings, quotes, and payout orders — with idempotent writes on all
  create operations. Surfaced as a Kindred Ventures portfolio company and enriched
  into the API Evangelist network.
